[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kagglers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "psutil",
    "kaggle",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
kagglers = "kagglers.cli:main"

[tool.setuptools.packages.find]
include = ["kagglers*"]
